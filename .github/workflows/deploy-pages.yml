name: Deploy live demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - style.css
      - favicon.svg
      - data/**
      - vendor/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify deploy-only runtime
        run: |
          test -s index.html
          test -s app.js
          test -s style.css
          test -s data/sample.json
          test -s data/geography.geojson
          test -s vendor/leaflet.js
          test ! -e app.mjs
          test ! -e model.mjs
          test ! -e i18n.mjs
          test ! -d tests
          test ! -d scripts
          test -z "$(find . -type f \( -name '*.xlsx' -o -name '*.map' \) -print -quit)"
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
