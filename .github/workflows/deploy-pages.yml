name: Publicera GIS – kravtester och verifierad liveversion
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  requirements:
    name: 01 · Kravtester före publicering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/package-lock.json
      - name: Installera låsta E2E- och tillgänglighetsverktyg
        run: |
          npm ci --prefix .github
          node .github/node_modules/playwright/cli.js install --with-deps chromium
      - name: Kontrollera filhashar och bygg publiceringspaketet
        run: node .github/stage-runtime.cjs
      - name: Bildernas UI-krav, yrkesprofil, 162 mått och tillgänglighet
        env:
          SITE_ROOT: _site
          RESULTS_DIR: test-results
        run: node .github/tests/research-e2e.cjs
      - name: Lås den testade versionen
        id: release
        run: echo "id=$(node -p 'require("./release.json").release')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 01-Kravtester-E2E-WCAG-skarmbilder
          path: test-results
          retention-days: 30
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    name: 02 · Publicera verifierad visualisering
    needs: requirements
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
  live:
    name: 03 · E2E på publicerad version
    needs: [requirements, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --prefix .github
      - run: node .github/node_modules/playwright/cli.js install --with-deps chromium
      - name: Kontrollera rätt liveversion och kör hela E2E-sviten igen
        env:
          BASE_URL: ${{ needs.deploy.outputs.url }}
          EXPECTED_RELEASE: ${{ needs.requirements.outputs.release }}
          RESULTS_DIR: test-results
        run: node .github/tests/research-e2e.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 03-Liveverifiering-E2E-WCAG-skarmbilder
          path: test-results
          retention-days: 30
