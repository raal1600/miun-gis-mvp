name: Fix bootstrap workflow

on:
  push:
    paths:
      - .github/workflows/fix-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Repair esbuild invocation
        run: |
          sed -i 's/ --sourcemap=false//' .github/workflows/bootstrap-runtime.yml
          git add .github/workflows/bootstrap-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: repair bootstrap bundling'
          git push
