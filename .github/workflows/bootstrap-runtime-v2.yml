name: Bootstrap public GIS runtime v2

on:
  push:
    paths:
      - .github/workflows/bootstrap-runtime-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Recover one-time source snapshot URL
        run: |
          python - <<'PY' > /tmp/source-url
          from pathlib import Path
          import re
          text=Path('.github/workflows/bootstrap-runtime.yml').read_text()
          m=re.search(r'SOURCE_URL:\s*"([^"]+)"',text)
          if not m: raise SystemExit('Source snapshot URL not found')
          print(m.group(1))
          PY
      - name: Download private-source build snapshot
        run: |
          SOURCE_URL="$(cat /tmp/source-url)"
          curl --fail --location --retry 3 "$SOURCE_URL" -o /tmp/source.zip
          rm -rf /tmp/src /tmp/public
          mkdir -p /tmp/src /tmp/public/data /tmp/public/vendor
          unzip -q /tmp/source.zip -d /tmp/src
      - name: Build minified browser runtime only
        run: |
          npx --yes esbuild@0.25.9 /tmp/src/app.mjs --bundle --minify --target=es2020 --platform=browser --format=esm --legal-comments=none --outfile=/tmp/public/app.js
          npx --yes esbuild@0.25.9 /tmp/src/style.css --minify --legal-comments=none --outfile=/tmp/public/style.css
          python - <<'PY'
          from pathlib import Path
          src=Path('/tmp/src'); out=Path('/tmp/public')
          html=(src/'index.html').read_text()
          html=html.replace('src="./app.mjs"','src="./app.js"')
          (out/'index.html').write_text(html)
          (out/'favicon.svg').write_bytes((src/'favicon.svg').read_bytes())
          for n in ['sample.json','geography.geojson']:(out/'data'/n).write_bytes((src/'data'/n).read_bytes())
          for n in ['leaflet.js','leaflet.css','Leaflet-LICENSE']:(out/'vendor'/n).write_bytes((src/'vendor'/n).read_bytes())
          (out/'.nojekyll').write_text('')
          PY
      - name: Commit deploy-only runtime
        run: |
          rm -rf index.html app.js style.css favicon.svg data vendor .nojekyll
          cp -a /tmp/public/. .
          git add index.html app.js style.css favicon.svg data vendor .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'deploy: publish minified GIS MVP runtime' || exit 0
          git push
